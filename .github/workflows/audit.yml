name: Security audit

on:
  schedule:
    - cron: "0 0 * * 0"
  push:
    paths:
      - "**/Cargo.toml"
      - "**/Cargo.lock"
  pull_request:

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      checks: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      # Cargo.lock is not committed (.gitignore), and rustsec/audit-check does
      # not create one, so resolve it here the way a fresh build would.
      - name: Generate Cargo.lock
        run: cargo generate-lockfile
      # actions-rs/audit-check is archived and could not create its check run
      # here ("Resource not accessible by integration"). rustsec/audit-check is
      # the maintained successor. Ignored advisories, each with its reason,
      # live in .cargo/audit.toml so a local `cargo audit` agrees with CI.
      - uses: rustsec/audit-check@v2.0.0
        env:
          SSH_AUTH_SOCK: /tmp/ssh_agent.sock
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
