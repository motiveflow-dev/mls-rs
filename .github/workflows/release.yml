name: Release wheels to PyPI

on:
  push:
    tags:
      - 'v*'
  pull_request:
    paths:
      - 'mls-rs-uniffi/**'
      - '.github/workflows/release.yml'
      - '.github/scripts/check_release_artifacts.py'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build_wheels:
    name: Build ${{ matrix.os }} (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            manylinux: manylinux2014
          - os: macos-latest
            target: universal2-apple-darwin
            manylinux: ''
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            manylinux: ''
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # maturin is pinned so a new release cannot change the build silently:
      # maturin 1.16 began rejecting more than one `-i` for uniffi bindings,
      # which broke every wheel build between v0.1.1 (May) and November.
      # uniffi wheels do not link libpython, so no `-i` is passed at all and
      # one py3-none wheel per platform covers every Python >= 3.10.
      - name: Build wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: v1.16.0
          working-directory: mls-rs-uniffi
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: >-
            --release
            --out dist
            --features vendored-openssl
          before-script-linux: |
            # OpenSSL 3.x's vendored build script needs perl-IPC-Cmd,
            # perl-Module-Load-Conditional, and Time::Piece. perl-File-Compare
            # is part of core perl on CentOS 7 (manylinux2014 base) so no
            # separate package is needed for that one.
            if command -v dnf &>/dev/null; then
              dnf install -y perl-IPC-Cmd perl-Module-Load-Conditional perl-Time-Piece make
            elif command -v yum &>/dev/null; then
              yum install -y perl-IPC-Cmd perl-Module-Load-Conditional perl-Time-Piece make
            elif command -v apt-get &>/dev/null; then
              apt-get update && apt-get install -y perl make
            fi

      - name: Upload wheels
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}
          path: mls-rs-uniffi/dist/*.whl
          retention-days: 7

  build_sdist:
    name: Build sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Build sdist
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: v1.16.0
          working-directory: mls-rs-uniffi
          command: sdist
          args: --out dist

      - name: Upload sdist
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sdist
          path: mls-rs-uniffi/dist/*.tar.gz
          retention-days: 7

  # Gate for publish. .github/scripts/check_release_artifacts.py checks the
  # three wheels and the sdist: platform tag sets match v0.1.1 (compared as
  # sets, since maturin 1.16 orders compressed tags differently), every
  # artifact is the agentvault-mls distribution, and every wheel's SBOM is
  # non-empty and free of crypto-bigint / rusqlite / libsqlite3-sys (the
  # precondition for the RUSTSEC-2026-0387 ignore in .cargo/audit.toml).
  # On a tag it also requires METADATA Version == the tag without its "v",
  # so pushing v0.1.2 while pyproject.toml says 0.1.1 cannot publish 0.1.1.
  verify_artifacts:
    name: Verify release artifacts
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Download wheels and sdist
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true

      - name: Check names, tags and SBOMs
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: python3 -I .github/scripts/check_release_artifacts.py dist

      - name: Check names, tags, SBOMs and version against the tag
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        env:
          REF_NAME: ${{ github.ref_name }}
        run: python3 -I .github/scripts/check_release_artifacts.py dist --expect-version "${REF_NAME#v}"

  # Fails the run (and so blocks publish) if the manylinux wheel cannot be
  # installed and used from a clean venv. v0.1.0 shipped a manylinux wheel
  # with no bindings module; this is the check that would have caught it.
  smoke_test:
    name: Linux smoke (Python ${{ matrix.python }})
    needs: [build_wheels]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Download wheels
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: wheels-*
          path: wheels
          merge-multiple: true

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}

      - name: Install manylinux wheel in a clean venv and run scenarios
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --no-index wheels/*manylinux*x86_64*.whl
          # Run from outside the checkout so the import can only resolve to
          # the installed wheel.
          mkdir "$RUNNER_TEMP/smoke"
          cp mls-rs-uniffi/tests/simple_scenario_sync.py mls-rs-uniffi/tests/export_secret_sync.py "$RUNNER_TEMP/smoke/"
          cd "$RUNNER_TEMP/smoke"
          "$RUNNER_TEMP/venv/bin/python" -I -c 'import mls_rs_uniffi, sys; print(mls_rs_uniffi.__file__); assert "site-packages" in mls_rs_uniffi.__file__'
          # METADATA must carry the new distribution name, and it must map to
          # the unchanged import package.
          "$RUNNER_TEMP/venv/bin/python" -I - <<'PY'
          import importlib.metadata as md
          dist = md.distribution("agentvault-mls")
          print("METADATA Name:", dist.metadata["Name"], dist.version)
          assert dist.metadata["Name"] == "agentvault-mls", dist.metadata["Name"]
          top = {f.parts[0] for f in dist.files}
          print("top-level entries:", sorted(top))
          assert "mls_rs_uniffi" in top, top
          PY
          "$RUNNER_TEMP/venv/bin/python" -I simple_scenario_sync.py
          "$RUNNER_TEMP/venv/bin/python" -I export_secret_sync.py
          echo "smoke OK"

  publish:
    name: Publish to PyPI
    needs: [build_wheels, build_sdist, verify_artifacts, smoke_test]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    environment:
      name: pypi-release
      url: https://pypi.org/project/agentvault-mls/
    permissions:
      id-token: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true

      - name: Publish to PyPI via OIDC trusted publishing
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1 (v1.14.3)
        with:
          packages-dir: dist
