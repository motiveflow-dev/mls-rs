name: Release wheels to PyPI

on:
  push:
    tags:
      - 'v*'
  pull_request:
    paths:
      - 'mls-rs-uniffi/**'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build_wheels:
    name: Build ${{ matrix.os }} (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            manylinux: manylinux2014
          - os: macos-latest
            target: universal2-apple-darwin
            manylinux: ''
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            manylinux: ''
    steps:
      - uses: actions/checkout@v4

      # maturin is pinned so a new release cannot change the build silently:
      # maturin 1.16 began rejecting more than one `-i` for uniffi bindings,
      # which broke every wheel build between v0.1.1 (May) and November.
      # uniffi wheels do not link libpython, so no `-i` is passed at all and
      # one py3-none wheel per platform covers every Python >= 3.10.
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          maturin-version: v1.16.0
          working-directory: mls-rs-uniffi
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: >-
            --release
            --out dist
            --features vendored-openssl
          before-script-linux: |
            # OpenSSL 3.x's vendored build script needs perl-IPC-Cmd,
            # perl-Module-Load-Conditional, and Time::Piece. perl-File-Compare
            # is part of core perl on CentOS 7 (manylinux2014 base) so no
            # separate package is needed for that one.
            if command -v dnf &>/dev/null; then
              dnf install -y perl-IPC-Cmd perl-Module-Load-Conditional perl-Time-Piece make
            elif command -v yum &>/dev/null; then
              yum install -y perl-IPC-Cmd perl-Module-Load-Conditional perl-Time-Piece make
            elif command -v apt-get &>/dev/null; then
              apt-get update && apt-get install -y perl make
            fi

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}
          path: mls-rs-uniffi/dist/*.whl
          retention-days: 7

  build_sdist:
    name: Build sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          maturin-version: v1.16.0
          working-directory: mls-rs-uniffi
          command: sdist
          args: --out dist

      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: mls-rs-uniffi/dist/*.tar.gz
          retention-days: 7

  # Fails the run (and so blocks publish) if a wheel's tag drifts from what
  # v0.1.1 shipped, or if the manylinux wheel cannot be installed and used
  # from a clean venv. v0.1.0 shipped a manylinux wheel with no bindings
  # module; this is the check that would have caught it.
  smoke_test:
    name: Wheel tags + Linux smoke (Python ${{ matrix.python }})
    needs: [build_wheels]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4

      - name: Download wheels
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: wheels
          merge-multiple: true

      - name: Check wheel tags
        shell: bash
        run: |
          set -euo pipefail
          ls -1 wheels
          for tag in \
            'py3-none-manylinux_2_17_x86_64.manylinux2014_x86_64' \
            'py3-none-macosx_10_12_x86_64.macosx_11_0_arm64.macosx_10_12_universal2' \
            'py3-none-win_amd64'; do
            n=$(ls wheels | grep -c -- "-${tag}\.whl$" || true)
            if [ "$n" != "1" ]; then
              echo "::error::expected exactly one wheel tagged ${tag}, found ${n}"
              exit 1
            fi
          done
          [ "$(ls wheels | wc -l)" = "3" ] || { echo "::error::expected 3 wheels"; exit 1; }

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install manylinux wheel in a clean venv and run scenarios
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --no-index wheels/*-manylinux_2_17_x86_64.manylinux2014_x86_64.whl
          # Run from outside the checkout so the import can only resolve to
          # the installed wheel.
          mkdir "$RUNNER_TEMP/smoke"
          cp mls-rs-uniffi/tests/simple_scenario_sync.py mls-rs-uniffi/tests/export_secret_sync.py "$RUNNER_TEMP/smoke/"
          cd "$RUNNER_TEMP/smoke"
          "$RUNNER_TEMP/venv/bin/python" -I -c 'import mls_rs_uniffi, sys; print(mls_rs_uniffi.__file__); assert "site-packages" in mls_rs_uniffi.__file__'
          "$RUNNER_TEMP/venv/bin/python" -I simple_scenario_sync.py
          "$RUNNER_TEMP/venv/bin/python" -I export_secret_sync.py
          echo "smoke OK"

  publish:
    name: Publish to PyPI
    needs: [build_wheels, build_sdist, smoke_test]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    environment:
      name: pypi-release
      url: https://pypi.org/project/agentvault-mls-rs-uniffi/
    permissions:
      id-token: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish to PyPI via OIDC trusted publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
